# Compile le jeu, lance les tests et prépare une archive prête à jouer sous Linux, Windows et macOS.
# Une étiquette v* (git tag v1.0 && git push origin v1.0) publie en plus les archives dans les Releases.
name: Compilation

on:
  push:
  pull_request:
  workflow_dispatch: # relance à la main depuis l'onglet Actions

jobs:
  compilation:
    name: ${{ matrix.systeme }}
    runs-on: ${{ matrix.systeme }}
    strategy:
      fail-fast: false
      matrix:
        systeme: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      # Sous Linux, SFML utilise FreeType et HarfBuzz du système ; Windows et macOS les compilent
      - name: Dépendances (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxcursor-dev libxi-dev libudev-dev \
            libgl1-mesa-dev libfreetype-dev libharfbuzz-dev

      # Un compilateur mis à jour avec l'image du runner invalide le cache
      - name: Image du runner
        id: image
        shell: bash
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"

      # Dossier de build gardé d'une exécution à l'autre : SFML et ses dépendances ne sont ni
      # retéléchargées ni recompilées, seul le code du jeu l'est
      - name: Cache du build
        uses: actions/cache@v6
        with:
          path: build
          key: build-${{ runner.os }}-${{ steps.image.outputs.version }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: build-${{ runner.os }}-${{ steps.image.outputs.version }}-

      - name: Configuration
        shell: bash
        run: |
          options=()
          # Windows : bibliothèque C++ liée en statique, le jeu ne demande aucune DLL à installer
          if [ "$RUNNER_OS" = Windows ]; then
            options+=(-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DSFML_USE_STATIC_STD_LIBS=ON)
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "${options[@]}"

      - name: Compilation
        run: cmake --build build --config Release --parallel

      - name: Tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      # Archive du jeu : zip sous Windows, tar ailleurs (garde le droit d'exécution)
      - name: Archive
        shell: bash
        run: |
          cmake --install build --config Release --component jeu --prefix Tetris --strip
          if [ "$RUNNER_OS" = Windows ]; then
            cmake -E tar cf Tetris-Windows.zip --format=zip Tetris
          else
            tar czf "Tetris-$RUNNER_OS.tar.gz" Tetris
          fi

      # Envoyée telle quelle (sans zip autour) : l'artefact est directement l'archive du jeu
      - uses: actions/upload-artifact@v7
        with:
          path: Tetris-${{ runner.os }}.*
          archive: false

  publication:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: compilation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Archives gardées telles quelles : le zip de Windows ne doit pas être décompressé
      - uses: actions/download-artifact@v8
        with:
          pattern: Tetris-*
          merge-multiple: true
          skip-decompress: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Tetris-* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes
